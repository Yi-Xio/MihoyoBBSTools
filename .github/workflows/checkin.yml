name: 米游社签到

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # 北京时间 07:30

permissions:
  contents: read

concurrency:
  group: mihoyo-checkin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-matrix:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: mihoyo-checkin
    timeout-minutes: 5
    outputs:
      accounts: ${{ steps.matrix.outputs.accounts }}
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 生成账号矩阵
        id: matrix
        env:
          MIHOYO_ACCOUNTS: ${{ secrets.MIHOYO_ACCOUNTS }}
        run: python3 .github/scripts/actions_checkin.py

  account:
    name: '米游社账号 #${{ matrix.account }}'
    needs: build-matrix
    runs-on: ubuntu-24.04
    environment: mihoyo-checkin
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account: ${{ fromJSON(needs.build-matrix.outputs.accounts) }}
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.9'
          enable-cache: false

      - name: 准备运行环境
        timeout-minutes: 10
        run: |
          uv venv --python 3.13
          uv pip install -r requirements.txt
          uv pip check
          .venv/bin/python --version

      - name: 执行上游签到和推送
        id: checkin
        timeout-minutes: 5
        env:
          ACCOUNT_INDEX: ${{ matrix.account }}
          MIHOYO_ACCOUNTS: ${{ secrets.MIHOYO_ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          umask 077
          .venv/bin/python .github/scripts/actions_account.py "$ACCOUNT_INDEX"

      - name: 发布摘要
        if: ${{ !cancelled() }}
        env:
          ACCOUNT_STATUS: ${{ steps.checkin.outputs.status }}
          ACCOUNT_OUTCOME: ${{ steps.checkin.outcome }}
        run: |
          case "$ACCOUNT_STATUS:$ACCOUNT_OUTCOME" in
            completed:success) result='执行结束' ;;
            timed-out:failure) result='执行超时' ;;
            config-error:failure) result='未执行（配置无效）' ;;
            *:skipped) result='未执行（环境准备失败）' ;;
            *) result='进程异常' ;;
          esac
          printf '%s\n\n%s\n' '### 签到执行' "$result" >> "$GITHUB_STEP_SUMMARY"
